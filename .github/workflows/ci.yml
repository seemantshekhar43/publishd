name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Internal broken links fail the build; external ones only warn - a
      # third-party outage must never block a deploy. See issue #28.
      - name: Check links
        run: pnpm check-links

      # Never fails - a small tag vocabulary is a taste call. See issue #26.
      - name: Check tags
        run: pnpm check-tags

  lighthouse:
    name: lighthouse budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Real content lives in the private content repo (docs/architecture.md
      # section 2) - the same fixtures the build tests use stand in for it
      # here, so Lighthouse has an article and a tag page to score, not
      # just an empty homepage. See apps/web/src/content-collection.build.test.ts.
      - name: Seed fixture content
        run: |
          mkdir -p apps/web/src/content/posts
          cp apps/web/tests/fixtures/published-post.md apps/web/src/content/posts/
          cp apps/web/tests/fixtures/tagged-post.md apps/web/src/content/posts/

      - name: Build
        run: pnpm --filter @publishd/web build
        env:
          PUBLISHD_PREVIEW_SECRET: lighthouse-ci-preview-secret

      # docs/design.md section 6's budget - see issue #29. Posts scores and
      # a report link to the job's own step summary, one click from the PR
      # checks tab rather than buried in raw logs.
      - name: Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  visual:
    name: visual regression + contrast (both themes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      # docs/PRD.md section 9.6's bet on restraint reads as taste - a
      # screenshot diff is how a regression there actually gets caught. The
      # WCAG AA contrast checks (issue #29 acceptance criteria) run here
      # too, in both themes, alongside Lighthouse's accessibility score.
      - name: Playwright (screenshots + WCAG AA contrast)
        run: pnpm test:visual
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  identity:
    name: no hardcoded identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deployment-specific identity belongs in site.config.ts, never in source.
      # See docs/architecture.md section 8 and issue #3.
      - name: Check for hardcoded identity in source
        run: |
          if grep -rniE 'shekse\.com|seemantshekhar43|shekse-publish-content' \
               apps packages 2>/dev/null; then
            echo "::error::Hardcoded deployment identity found in apps/ or packages/."
            echo "Move it to site.config.ts - see docs/architecture.md section 8."
            exit 1
          fi
          echo "No hardcoded identity found."

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
